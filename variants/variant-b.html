<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Marcellus";
        src: url("assets/fonts/marcellus-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #551a25;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #551a25;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <!-- Persistent brand background -->
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="15" data-track-index="0" data-width="1080" data-height="1920"></div>

      <!-- Scenes -->
      <div id="hook" data-composition-id="hook-b" data-composition-src="compositions/hook-b.html" data-start="0" data-duration="2.4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html" data-start="2.4" data-duration="5.2" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="place" data-composition-id="place" data-composition-src="compositions/place.html" data-variable-values='{"title1":"Pide y retira","title2":"en Las Condes"}' data-start="7.6" data-duration="3.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-variable-values='{"cta_text":"Llama y retira tu pedido"}' data-start="11.2" data-duration="3.8" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- Sound design -->
      <audio id="sfx-whoosh-1" src="assets/sfx/whoosh-short.mp3" data-start="2.25" data-duration="0.57" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-2" src="assets/sfx/whoosh.mp3" data-start="7.45" data-duration="0.57" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-3" src="assets/sfx/whoosh-short.mp3" data-start="11.05" data-duration="0.57" data-track-index="5" data-volume="0.5"></audio>
      <audio id="sfx-impact" src="assets/sfx/impact-bass-2.mp3" data-start="10.9" data-duration="2.5" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-sparkle" src="assets/sfx/sparkle.mp3" data-start="12.1" data-duration="1.5" data-track-index="7" data-volume="0.45"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
