<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Marcellus";
          src: url("assets/fonts/marcellus-latin-400-normal.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #2e0b13;
        }
        #hc-photo {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #hc-photo img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 50% 45%;
        }
        #hc-panel {
          position: absolute;
          left: 80px;
          right: 140px;
          top: 280px;
          padding: 46px 56px 50px;
          background: rgba(85, 26, 37, 0.94);
          border: 3px solid #c9a66b;
        }
        .hc-line {
          display: flex;
          gap: 24px;
          font-family: "Marcellus", serif;
          line-height: 1.02;
          letter-spacing: -0.02em;
        }
        .hc-line span {
          display: inline-block;
        }
        #hc-l1 {
          font-size: 104px;
          color: #f4e8d4;
        }
        #hc-l2 {
          font-size: 120px;
          color: #e0c08a;
        }
        #hc-tag {
          margin-top: 22px;
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.3em;
          color: #c9a66b;
        }
      </style>

      <div id="root" data-composition-id="hook-c" data-width="1080" data-height="1920">
        <div id="hc-photo"><img id="hc-img" src="assets/place/patio.jpg" alt="Terraza de China Village" /></div>
        <div id="hc-panel">
          <div id="hc-l1" class="hc-line"><span id="hc-w1">¿Almuerzo</span></div>
          <div id="hc-l2" class="hc-line"><span id="hc-w2">con</span><span id="hc-w3">terraza?</span></div>
          <div id="hc-tag">CHINA VILLAGE · LAS CONDES</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Slow push into the terrace.
        tl.fromTo("#hc-img", { scale: 1.22, y: 40 }, { scale: 1.04, y: 0, duration: 2.4, ease: "sine.out" }, 0);

        // Panel drops in; words punch.
        tl.fromTo("#hc-panel", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.15);
        tl.fromTo("#hc-w1", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.35);
        tl.fromTo("#hc-w2", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.65);
        tl.fromTo("#hc-w3", { scale: 1.3, rotation: 5, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.8);
        tl.fromTo("#hc-tag", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 1.1);

        // Exit: panel lifts, photo fades to the brand background.
        tl.to("#hc-panel", { y: -100, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.1);
        tl.to("#hc-photo", { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.15);

        window.__timelines["hook-c"] = tl;
      </script>
    </template>
  </body>
</html>
