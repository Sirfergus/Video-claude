        </div>

        <div data-hf-id="hf-5l5f" id="mt-stage">
          <div data-hf-id="hf-5bki" id="mt-d0" class="mt-dish"><img data-hf-id="hf-ltc2" src="assets/dishes/gyozas.png" alt="Gyozas"></div>
          <div data-hf-id="hf-99oj" id="mt-d1" class="mt-dish"><img data-hf-id="hf-ag67" src="assets/dishes/tallarines-camarones.png" alt="Tallarines con camarones"></div>

          <div data-hf-id="hf-wnon" id="mt-d5" class="mt-dish"><img data-hf-id="hf-jsk1" src="assets/dishes/pollo-verduras.png" alt="Pollo con verduras"></div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Title: waterfall entry.
        tl.fromTo("#mt-eyebrow", { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.05);
        tl.fromTo(["#mt-t1", "#mt-t2", "#mt-t3"], { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out", stagger: 0.09 }, 0.1);
        tl.fromTo("#mt-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "0% 50%" }, 0.3);

        // Dish relay: each springs in with a spin, then swaps out to the left.
        const START = 0.2;
        const STEP = 0.8;
        const COUNT = 6;
        for (let i = 0; i < COUNT; i++) {
          const t = START + i * STEP;
          const dir = i % 2 === 0 ? 1 : -1;
          tl.fromTo(`#mt-d${i}`, { scale: 0.5, rotation: -22 * dir, x: 360 * dir, opacity: 0 }, { scale: 1, rotation: 0, x: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, t);
          tl.fromTo(`#mt-n${i}`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t + 0.08);
          if (i < COUNT - 1) {
            tl.to(`#mt-d${i}`, { scale: 0.7, rotation: 18 * dir, x: -380 * dir, opacity: 0, duration: 0.28, ease: "power2.in" }, t + STEP - 0.18);
            tl.to(`#mt-n${i}`, { y: -30, opacity: 0, duration: 0.2, ease: "power2.in" }, t + STEP - 0.16);
          }
        }

        // Last dish floats gently, then the scene clears.
        const lastT = START + (COUNT - 1) * STEP + 0.45;
        tl.fromTo("#mt-d5 img", { y: 0 }, { y: -14, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, lastT);
        tl.to(["#mt-head", "#mt-names", "#mt-rule", "#mt-stage"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 5.0);

        window.__timelines["montage"] = tl;
      </script>
